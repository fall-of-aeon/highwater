[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "highwater"
version = "0.1.0"
description = "A replicated log and exactly-once stream processor, built from first principles."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "orjson>=3.10",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=5.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
postgres = ["psycopg[binary]>=3.1"]
bench = ["matplotlib>=3.8", "numpy>=1.26"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
hw = "highwater.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: spawns real OS processes and binds real sockets",
    "slow: takes more than a few seconds",
]
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "ASYNC"]
ignore = [
    "E501",     # line length is handled by the formatter
    "B008",     # FastAPI Depends() in defaults is the documented idiom
    "SIM108",   # ternaries are not always clearer than an if/else
    "RET504",   # a named return value often *is* the documentation
    # Every RPC in this system takes an explicit timeout, because a caller
    # deciding how long it is willing to wait is part of the protocol, not an
    # implementation detail. ASYNC109 would have us hoist that to the call site
    # of every single call.
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E702"]
# Log segments and the Raft WAL hold file handles open for the lifetime of the
# object: that is what an append-only log is. A context manager per append
# would reopen the file on the hottest path in the system.
"src/highwater/raft/log.py" = ["SIM115"]
"src/highwater/broker/segment.py" = ["SIM115"]
# The SQLite sink makes blocking calls inside an async interface. For
# transactions of a few dozen rows the sqlite3 C call costs single-digit
# microseconds -- less than the executor hop that would "fix" it -- and keeping
# it on the loop thread is what lets the deterministic simulator drive it.
# Documented in the module docstring; the Postgres sink is genuinely async.
"src/highwater/stream/sink.py" = ["ASYNC230"]
"src/highwater/supervisor.py" = ["SIM115", "ASYNC230"]

[tool.mypy]
python_version = "3.12"
packages = ["highwater"]
mypy_path = "src"
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
